name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/security-auth-foundation

permissions:
  contents: read

jobs:
  verify:
    name: Security and auth checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Auth flow tests
        run: bun run test:auth

      - name: Firestore Security Rules tests
        run: bun run test:rules

      - name: Vite production build
        run: bun run build
